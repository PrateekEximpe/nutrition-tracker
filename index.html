// ============================================================
// MOCK AI PARSER
// ============================================================
function parseFood(text) {
  // Normalise: lowercase for English parts, keep Devanagari intact
  const lower = text.toLowerCase().trim();
  const results = [];
  const usedRanges = [];

  // Sort by key length descending (longest match wins)
  const foods = Object.keys(FOOD_DB).sort((a, b) => b.length - a.length);

  for (const food of foods) {
    // For Devanagari keys use original text; for English use lowercased
    const isDevanagari = /[\u0900-\u097F]/.test(food);
    const searchIn = isDevanagari ? text : lower;

    let startIdx = 0;
    while (true) {
      const idx = searchIn.indexOf(food, startIdx);
      if (idx === -1) break;
      startIdx = idx + 1;

      if (!isDevanagari) {
        // Word-boundary check for Latin script — allow trailing 's' for plurals
        const before = searchIn[idx - 1];
        const after  = searchIn[idx + food.length];
        const afterAfter = searchIn[idx + food.length + 1];
        const isPluralS = after === 's' && (!afterAfter || !/[a-z]/.test(afterAfter));
        if (before && /[a-z]/.test(before)) continue;
        if (after && /[a-z]/.test(after) && !isPluralS) continue;
      }

      // Overlap check
      const overlap = usedRanges.some(([s, e]) => idx < e && idx + food.length > s);
      if (overlap) continue;

      // ── Extract quantity from the text before the food name ──
      // Use original text for Devanagari (preserves script); lowercase for Latin
      const beforeText = lower.substring(0, idx).trim();
      const beforeTextOrig = text.substring(0, idx).trim();
      const tokens = beforeText.split(/[\s,।]+/);
      const tokensOrig = beforeTextOrig.split(/[\s,।]+/);
      const lastToken = tokens[tokens.length - 1];
      const lastTokenOrig = tokensOrig[tokensOrig.length - 1];
      const secondLastToken = tokens[tokens.length - 2];

      let quantity = 1;
      const dbItem = FOOD_DB[food];

      // Handle "Xg" / "X grams" for 100g-unit foods (e.g. "200g chicken" → 2 servings)
      const gramMatch = beforeText.match(/(\d+(?:\.\d+)?)\s*g(?:rams?)?$/i);
      if (gramMatch) {
        const grams = parseFloat(gramMatch[1]);
        if (dbItem.unit === '100g') {
          quantity = grams / 100;
        } else {
          quantity = 1;
        }
      } else if (lastToken && !isNaN(parseFloat(lastToken))) {
        quantity = parseFloat(lastToken);
      } else if (lastTokenOrig && QUANTITY_WORDS[lastTokenOrig] !== undefined) {
        // catches Devanagari digits (१, २…) and Hindi words (ek, do, teen…)
        quantity = QUANTITY_WORDS[lastTokenOrig];
      } else if (lastToken && QUANTITY_WORDS[lastToken] !== undefined) {
        quantity = QUANTITY_WORDS[lastToken];
      } else if (secondLastToken && !isNaN(parseFloat(secondLastToken)) &&
                 ['cup', 'cups', 'tbsp', 'tsp', 'scoop', 'scoops', 'slice', 'slices', 'bowl', 'bowls'].includes(lastToken)) {
        quantity = parseFloat(secondLastToken);
      }

      // Display name: capitalise each word for Latin; keep Devanagari as-is
      const displayName = isDevanagari
        ? food
        : food.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

      results.push({
        name: displayName,
        quantity: Math.round(quantity * 100) / 100,
        unit: dbItem.unit,
        calories: Math.round(dbItem.calories * quantity),
        protein: Math.round(dbItem.protein * quantity * 10) / 10,
      });

      usedRanges.push([idx, idx + food.length]);
      break;
    }
  }

  const recognized = results.length > 0;

  if (!recognized) {
    results.push({
      name: text.charAt(0).toUpperCase() + text.slice(1),
      quantity: 1,
      unit: 'serving',
      calories: 200,
      protein: 8,
    });
  }

  results.__recognized = recognized;
  return results;
}

// AI SUGGESTION ENGINE
// ============================================================
const AI_GOALS = { calories: 2000, protein: 150 };

function getSuggestions(consumed, goals) {
  const suggestions = [];
  const { calories: cal, protein: pro } = consumed;
  const { calories: calGoal, protein: proGoal } = goals;

  if (cal === 0 && pro === 0) {
    return [{
      type: 'info', emoji: '🌅',
      title: 'Start Your Day Right',
      message: 'No meals logged yet. Start with a protein-rich breakfast!',
      foods: ['Egg', 'Greek Yogurt', 'Oatmeal'],
    }];
  }

  const calPct = cal / calGoal;
  const proPct = pro / proGoal;

  if (cal > calGoal * 1.15) {
    suggestions.push({
      type: 'warning', emoji: '⚠️',
      title: 'Calorie Goal Exceeded',
      message: `You're ${Math.round(cal - calGoal)} kcal over your goal. Consider lighter options.`,
      foods: ['Salad', 'Broccoli', 'Soup', 'Spinach'],
    });
  } else if (calPct < 0.5) {
    suggestions.push({
      type: 'info', emoji: '🍽️',
      title: 'Eating Too Little',
      message: `Only ${Math.round(calPct * 100)}% of calories consumed. Add nourishing meals.`,
      foods: ['Peanut Butter', 'Rice', 'Almonds', 'Sweet Potato'],
    });
  } else if (calPct >= 0.85 && calPct <= 1.05) {
    suggestions.push({
      type: 'success', emoji: '✅',
      title: 'Calories On Track',
      message: `${Math.round(calGoal - cal)} kcal remaining. Keep it up!`,
      foods: [],
    });
  } else {
    suggestions.push({
      type: 'info', emoji: '📊',
      title: 'Calories Progress',
      message: `${Math.round(calPct * 100)}% of daily goal consumed. ${Math.round(calGoal - cal)} kcal to go.`,
      foods: [],
    });
  }

  if (proPct < 0.7) {
    suggestions.push({
      type: 'warning', emoji: '💪',
      title: 'Protein Gap',
      message: `Need ${Math.round(proGoal - pro)}g more protein today. Try these:`,
      foods: ['Chicken Breast', 'Whey Protein', 'Lentils', 'Paneer', 'Eggs'],
    });
  } else if (proPct >= 1) {
    suggestions.push({
      type: 'success', emoji: '🏆',
      title: 'Protein Goal Met!',
      message: 'Excellent protein intake today. Your muscles will thank you!',
      foods: [],
    });
  } else {
    suggestions.push({
      type: 'info', emoji: '🥩',
      title: 'Almost There on Protein',
      message: `Just ${Math.round(proGoal - pro)}g more protein needed.`,
      foods: ['Greek Yogurt', 'Almonds', 'Cheese', 'Tuna'],
    });
  }

  return suggestions;
}

function getToday() {
  return new Date().toISOString().split('T')[0];
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().split('T')[0]);
  }
  return days;
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2);
}

// STATE MANAGEMENT
// ============================================================
const AppContext = React.createContext(null);

function getInitialState() {
  try {
    const stored = localStorage.getItem('nutritrack_v2');
    if (stored) {
      const parsed = JSON.parse(stored);
      // Always open on today's date
      parsed.currentDate = getToday();
      return parsed;
    }
  } catch (e) {}
  return {
    goals: { calories: 2000, protein: 150, mode: 'manual' },
    logs: {},
    currentDate: getToday(),
  };
}

function reducer(state, action) {
  let newState;
  switch (action.type) {
    case 'SET_GOALS':
      newState = { ...state, goals: action.payload };
      break;
    case 'SET_DATE':
      newState = { ...state, currentDate: action.payload };
      break;
    case 'ADD_MEAL': {
      const { date, meal } = action.payload;
      newState = {
        ...state,
        logs: {
          ...state.logs,
          [date]: [...(state.logs[date] || []), meal],
        },
      };
      break;
    }
    case 'DELETE_MEAL': {
      const { date, mealId } = action.payload;
      newState = {
        ...state,
        logs: {
          ...state.logs,
          [date]: (state.logs[date] || []).filter(m => m.id !== mealId),
        },
      };
      break;
    }
    default:
      return state;
  }
  try { localStorage.setItem('nutritrack_v2', JSON.stringify(newState)); } catch (e) {}
  return newState;
}

function MacroRing({ value, max, color, label, unit, bgColor }) {
  const pct = Math.min(value / (max || 1), 1);
  const R = 38;
  const C = 2 * Math.PI * R;
  const dash = pct * C;
  const gap = C - dash;
  return (
    <div className="flex flex-col items-center">
      <div className="relative">
        <svg width="96" height="96" style={{ transform: 'rotate(-90deg)' }}>
          <circle cx="48" cy="48" r={R} fill="none" stroke="#1f2937" strokeWidth="9" />
          <circle
            cx="48" cy="48" r={R} fill="none"
            stroke={color} strokeWidth="9"
            strokeDasharray={`${dash} ${gap}`}
            strokeLinecap="round"
            style={{ transition: 'stroke-dasharray 0.8s ease' }}
          />
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <span className="text-base font-bold text-white" style={{ transform: 'none' }}>{Math.round(value)}</span>
          <span className="text-xs text-gray-400">{unit}</span>
        </div>
      </div>
      <span className="text-xs text-gray-400 mt-1.5 font-medium">{label}</span>
    </div>
  );
}

function TextLogger({ onSave }) {
  const [text, setText] = useState('');
  const [items, setItems] = useState(null);
  const [mealName, setMealName] = useState('');
  const [loading, setLoading] = useState(false);
  const [parseError, setParseError] = useState('');

  const examples = [
    '3 eggs and 2 rotis with a cup of milk tea',
    '100g chicken breast with 1 cup rice',
    '3 ande aur 2 roti with chai',
    '1 cup oatmeal with banana and almonds',
    '2 slices toast with peanut butter and coffee',
    'paneer sabzi with 2 roti and dahi',
  ];

  const handleParse = () => {
    if (!text.trim()) return;
    setParseError('');
    setLoading(true);
    setTimeout(() => {
      const parsed = parseFood(text);
      if (!parsed.__recognized) {
        setParseError('No food items recognized. Please enter a valid meal (e.g. "2 eggs and roti").');
        setLoading(false);
        return;
      }
      setItems(parsed);
      setMealName(text.length > 35 ? text.substring(0, 35) + '…' : text);
      setLoading(false);
    }, 900);
  };

  const updateItem = (i, field, val) => {
    const updated = [...items];
    updated[i] = { ...updated[i], [field]: parseFloat(val) || 0 };
    if (field === 'quantity') {
      const q = parseFloat(val) || 0;
      const base = FOOD_DB[updated[i].name.toLowerCase()];
      if (base) {
        updated[i].calories = Math.round(base.calories * q);
        updated[i].protein = Math.round(base.protein * q * 10) / 10;
      }
    }
    setItems(updated);
  };

  const handleSave = () => {
    const totalCalories = items.reduce((s, i) => s + (parseFloat(i.calories) || 0), 0);
    const totalProtein = items.reduce((s, i) => s + (parseFloat(i.protein) || 0), 0);
    onSave({
      id: genId(),
      name: mealName || 'Meal',
      items,
      totalCalories: Math.round(totalCalories),
      totalProtein: Math.round(totalProtein * 10) / 10,
      time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
      method: 'text',
    });
  };

  if (items) {
    return (
      <div>
        <FoodItemEditor items={items} onUpdate={updateItem} mealName={mealName} onMealNameChange={setMealName} />
        <div className="flex gap-2 sticky bottom-0 z-10 bg-gray-900 pt-3 -mx-5 px-5 modal-sticky-footer">
          <button onClick={() => setItems(null)} className="flex-1 py-3.5 rounded-2xl text-sm font-medium text-gray-400 bg-gray-700 hover:bg-gray-600 transition-colors">
            ← Re-parse
          </button>
          <button onClick={handleSave} className="flex-1 py-3.5 rounded-2xl text-sm font-bold bg-green-600 hover:bg-green-500 text-white transition-colors shadow-lg shadow-green-500/20">
            Save Meal ✓
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <textarea
        className="w-full bg-gray-800 border border-gray-600 rounded-2xl p-4 text-white text-sm placeholder-gray-500 resize-none focus:outline-none focus:border-green-500 transition-colors leading-relaxed"
        rows={4}
        placeholder="Describe what you ate in natural language…"
        value={text}
        onChange={e => setText(e.target.value)}
        onKeyDown={e => e.key === 'Enter' && e.metaKey && handleParse()}
      />
      {parseError && (
        <div className="mt-2 bg-red-500/10 border border-red-500/30 rounded-xl px-3 py-2.5 flex items-start gap-2">
          <span className="text-sm flex-shrink-0">⚠️</span>
          <p className="text-xs text-red-300">{parseError}</p>
        </div>
      )}
      <button
        onClick={handleParse}
        disabled={!text.trim() || loading}
        className="w-full mt-3 py-4 rounded-2xl font-bold text-sm bg-green-600 hover:bg-green-500 disabled:bg-gray-700 disabled:text-gray-500 text-white transition-colors"
      >
        {loading ? (
          <span className="flex items-center justify-center gap-2">
            <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" />
            Analyzing with AI…
          </span>
        ) : '🔍 Analyze Meal'}
      </button>
      <div className="mt-4">
        <p className="text-xs text-gray-500 mb-2">Try these examples:</p>
        <div className="space-y-1.5">
          {examples.map((ex, i) => (
            <button
              key={i}
              onClick={() => { setText(ex); setParseError(''); }}
              className="w-full text-left text-xs text-gray-400 bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded-xl border border-gray-700 hover:border-gray-500 transition-all"
            >
              💬 {ex}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function VoiceLogger({ onSave }) {
  const [listening, setListening] = useState(false);
  const [inputText, setInputText] = useState('');
  const [items, setItems] = useState(null);
  const [mealName, setMealName] = useState('');
  const [micStatus, setMicStatus] = useState('idle'); // idle | listening | error
  const [micError, setMicError] = useState('');
  const [parseError, setParseError] = useState('');
  const recRef = useRef(null);
  const supported = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;

  const startListening = () => {
    if (!supported) {
      setMicError('Voice recording not supported in this browser. Type your meal below.');
      setMicStatus('error');
      return;
    }
    try {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SR();
      rec.lang = 'en-IN';
      rec.interimResults = true;
      rec.continuous = false;
      rec.onresult = e => {
        const t = Array.from(e.results).map(r => r[0].transcript).join('');
        setInputText(t);
        setMicError('');
      };
      rec.onend = () => setMicStatus('idle');
      rec.onerror = e => {
        setMicStatus('error');
        if (e.error === 'not-allowed') {
          setMicError('Microphone permission denied. Please type your meal below.');
        } else if (e.error === 'no-speech') {
          setMicError('No speech detected. Please try again or type below.');
        } else {
          setMicError('Recording failed. Please type your meal below.');
        }
      };
      rec.start();
      recRef.current = rec;
      setMicStatus('listening');
      setMicError('');
    } catch (e) {
      setMicStatus('error');
      setMicError('Could not start recording. Please type your meal below.');
    }
  };

  const stopListening = () => {
    if (recRef.current) { try { recRef.current.stop(); } catch(e) {} }
    setMicStatus('idle');
  };

  const handleParse = () => {
    if (!inputText.trim()) return;
    setParseError('');
    const parsed = parseFood(inputText);
    if (!parsed.__recognized) {
      setParseError('No food items recognized. Please describe a valid meal (e.g. "2 eggs with roti").');
      return;
    }
    setItems(parsed);
    setMealName(inputText.length > 35 ? inputText.substring(0, 35) + '…' : inputText);
  };

  const updateItem = (i, field, val) => {
    const updated = [...items];
    updated[i] = { ...updated[i], [field]: parseFloat(val) || 0 };
    setItems(updated);
  };

  const handleSave = () => {
    const totalCalories = items.reduce((s, i) => s + (parseFloat(i.calories) || 0), 0);
    const totalProtein = items.reduce((s, i) => s + (parseFloat(i.protein) || 0), 0);
    onSave({
      id: genId(), name: mealName || 'Voice Meal', items,
      totalCalories: Math.round(totalCalories),
      totalProtein: Math.round(totalProtein * 10) / 10,
      time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
      method: 'voice',
    });
  };

  if (items) {
    return (
      <div>
        <FoodItemEditor items={items} onUpdate={updateItem} mealName={mealName} onMealNameChange={setMealName} />
        <div className="flex gap-2 sticky bottom-0 z-10 bg-gray-900 pt-3 -mx-5 px-5 modal-sticky-footer">
          <button onClick={() => setItems(null)} className="flex-1 py-3.5 rounded-2xl text-sm font-medium text-gray-400 bg-gray-700 hover:bg-gray-600">← Re-record</button>
          <button onClick={handleSave} className="flex-1 py-3.5 rounded-2xl text-sm font-bold bg-green-600 hover:bg-green-500 text-white shadow-lg shadow-green-500/20">Save Meal ✓</button>
        </div>
      </div>
    );
  }

  const isListening = micStatus === 'listening';

  return (
    <div>
      {/* Mic button row */}
      <div className="flex items-center gap-4 mb-4 bg-gray-800/60 border border-gray-700/50 rounded-2xl p-4">
        <button
          onClick={isListening ? stopListening : startListening}
          className={`w-14 h-14 rounded-full flex-shrink-0 flex items-center justify-center transition-all duration-200 ${
            isListening
              ? 'bg-red-600 shadow-lg shadow-red-500/40 scale-105'
              : 'bg-gray-700 hover:bg-gray-600 active:scale-95'
          }`}
        >
          <span className="text-2xl">{isListening ? '⏹' : '🎙️'}</span>
        </button>
        <div className="flex-1 min-w-0">
          <p className="text-sm font-semibold text-white">
            {isListening ? 'Listening… speak now' : 'Tap mic to record'}
          </p>
          <p className="text-xs text-gray-400 mt-0.5">
            {isListening ? 'Tap again to stop' : 'Speaks fills the text box below'}
          </p>
        </div>
        {isListening && (
          <div className="flex gap-0.5 items-end h-7 flex-shrink-0">
            {[3, 5, 4, 7, 4, 5, 3].map((h, i) => (
              <div key={i} className="w-1.5 bg-red-400 rounded-full animate-bounce"
                style={{ height: `${h * 3}px`, animationDelay: `${i * 0.1}s` }} />
            ))}
          </div>
        )}
      </div>

      {micError && (
        <div className="bg-yellow-500/10 border border-yellow-500/30 rounded-xl px-3 py-2.5 mb-3 flex items-start gap-2">
          <span className="text-sm flex-shrink-0">⚠️</span>
          <p className="text-xs text-yellow-300">{micError}</p>
        </div>
      )}

      {/* Text input */}
      <textarea
        className="w-full bg-gray-800 border border-gray-600 rounded-2xl p-4 text-white text-sm placeholder-gray-500 resize-none focus:outline-none focus:border-green-500 transition-colors leading-relaxed"
        rows={3}
        placeholder="Speak or type what you ate… e.g. 3 eggs with roti and chai"
        value={inputText}
        onChange={e => setInputText(e.target.value)}
        onKeyDown={e => e.key === 'Enter' && e.metaKey && handleParse()}
      />
      {parseError && (
        <div className="mt-2 bg-red-500/10 border border-red-500/30 rounded-xl px-3 py-2.5 flex items-start gap-2">
          <span className="text-sm flex-shrink-0">⚠️</span>
          <p className="text-xs text-red-300">{parseError}</p>
        </div>
      )}

      <button
        onClick={handleParse}
        disabled={!inputText.trim() || isListening}
        className="w-full mt-3 py-4 rounded-2xl font-bold text-sm bg-green-600 hover:bg-green-500 disabled:bg-gray-700 disabled:text-gray-500 text-white transition-colors"
      >
        {isListening ? '🎙️ Recording…' : '🔍 Analyze Meal'}
      </button>
    </div>
  );
}

function CameraLogger({ onSave }) {
  const [phase, setPhase] = useState('upload');
  const [imageUrl, setImageUrl] = useState(null);
  const [items, setItems] = useState(null);
  const [mealName, setMealName] = useState('Scanned Meal');
  const fileRef = useRef(null);

  const handleFile = e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    setImageUrl(url);
    setPhase('scanning');
    setTimeout(() => {
      const mock = SCAN_MOCKS[Math.floor(Math.random() * SCAN_MOCKS.length)];
      setItems(mock.map(i => ({ ...i })));
      setPhase('results');
    }, 2200);
  };

  const updateItem = (i, field, val) => {
    const updated = [...items];
    updated[i] = { ...updated[i], [field]: parseFloat(val) || 0 };
    setItems(updated);
  };

  const handleSave = () => {
    const totalCalories = items.reduce((s, i) => s + (parseFloat(i.calories) || 0), 0);
    const totalProtein = items.reduce((s, i) => s + (parseFloat(i.protein) || 0), 0);
    onSave({
      id: genId(), name: mealName, items,
      totalCalories: Math.round(totalCalories),
      totalProtein: Math.round(totalProtein * 10) / 10,
      time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
      method: 'camera',
    });
  };

  if (phase === 'upload') {
    return (
      <div>
        <div
          className="border-2 border-dashed border-gray-600 rounded-2xl p-10 text-center cursor-pointer hover:border-green-500 hover:bg-green-500/5 transition-all"
          onClick={() => fileRef.current.click()}
        >
          <div className="text-6xl mb-3">📷</div>
          <p className="text-gray-200 text-base font-semibold mb-1">Upload Food Photo</p>
          <p className="text-gray-500 text-sm">AI will detect items and estimate macros</p>
        </div>
        <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleFile} />
        <div className="mt-4 bg-gray-800/60 rounded-2xl p-4 border border-gray-700">
          <p className="text-xs font-semibold text-gray-400 mb-2">🤖 AI Can Detect:</p>
          <div className="flex flex-wrap gap-2">
            {['Rice', 'Roti', 'Dal', 'Eggs', 'Chicken', 'Oatmeal', 'Fruits', '+40 more'].map(f => (
              <span key={f} className="text-xs bg-gray-700 text-gray-300 px-2 py-1 rounded-full">{f}</span>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (phase === 'scanning') {
    return (
      <div className="text-center py-4">
        {imageUrl && <img src={imageUrl} className="w-full h-44 object-cover rounded-2xl mb-5" alt="food" />}
        <div className="flex flex-col items-center gap-4">
          <div className="w-14 h-14 border-4 border-green-500 border-t-transparent rounded-full animate-spin" />
          <div>
            <p className="text-white font-semibold text-sm">AI Analyzing Your Meal</p>
            <p className="text-gray-400 text-xs mt-1">Detecting foods • Estimating portions • Calculating macros</p>
          </div>
          <div className="flex gap-2">
            {['🔍 Detecting', '⚡ Estimating', '📊 Calculating'].map((s, i) => (
              <span key={i} className="text-xs text-gray-500 animate-pulse" style={{ animationDelay: `${i * 0.4}s` }}>{s}</span>
            ))}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      {imageUrl && <img src={imageUrl} className="w-full h-36 object-cover rounded-2xl mb-3" alt="food" />}
      <div className="flex items-center justify-between mb-3">
        <span className="text-xs text-green-400 font-semibold">✓ {items?.length} items detected</span>
        <button onClick={() => { setPhase('upload'); setImageUrl(null); setItems(null); }} className="text-xs text-gray-400 hover:text-white">Rescan ↺</button>
      </div>
      <FoodItemEditor items={items || []} onUpdate={updateItem} mealName={mealName} onMealNameChange={setMealName} />
      <div className="sticky bottom-0 z-10 bg-gray-900 pt-3 -mx-5 px-5 modal-sticky-footer">
        <button onClick={handleSave} className="w-full py-4 rounded-2xl text-sm font-bold bg-green-600 hover:bg-green-500 text-white transition-colors shadow-lg shadow-green-500/20">
          Save Meal ✓
        </button>
      </div>
    </div>
  );
}

// ============================================================
function RecentLogger({ onSave }) {
  const { state } = useContext(AppContext);
  const [added, setAdded] = useState({});

  // Collect all meals across all dates, most recent first, deduplicated by name
  const recentMeals = useMemo(() => {
    const allDates = Object.keys(state.logs).sort((a, b) => b.localeCompare(a));
    const seen = new Set();
    const meals = [];
    for (const date of allDates) {
      for (const meal of [...(state.logs[date] || [])].reverse()) {
        if (!seen.has(meal.name)) {
          seen.add(meal.name);
          meals.push({ ...meal, originalDate: date });
        }
      }
    }
    return meals.slice(0, 10);
  }, [state.logs]);

  const handleLog = meal => {
    onSave({
      ...meal,
      id: genId(),
      time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
    });
    setAdded(prev => ({ ...prev, [meal.name]: true }));
  };

  if (recentMeals.length === 0) {
    return (
      <div className="text-center py-10">
        <div className="text-5xl mb-3">🍽️</div>
        <p className="text-gray-300 text-sm font-medium">No past meals yet</p>
        <p className="text-gray-500 text-xs mt-1">Log your first meal using Text, Voice or Camera</p>
      </div>
    );
  }

  return (
    <div>
      <p className="text-xs text-gray-500 mb-3">Tap any meal to instantly log it for today</p>
      <div className="space-y-2">
        {recentMeals.map(meal => (
          <div key={meal.name} className="bg-gray-800/60 border border-gray-700/40 rounded-2xl p-3.5 flex items-center gap-3">
            <div className="flex-1 min-w-0">
              <p className="text-sm font-semibold text-white truncate">{meal.name}</p>
              <p className="text-xs text-gray-400 mt-0.5">
                {meal.totalCalories} kcal · {meal.totalProtein}g protein · {meal.items.length} item{meal.items.length !== 1 ? 's' : ''}
              </p>
            </div>
            <button
              onClick={() => handleLog(meal)}
              disabled={added[meal.name]}
              className={`flex-shrink-0 py-2 px-4 rounded-xl text-xs font-bold transition-all ${
                added[meal.name]
                  ? 'bg-green-700/40 text-green-300'
                  : 'bg-green-600 hover:bg-green-500 text-white active:scale-95'
              }`}
            >
              {added[meal.name] ? '✓ Added' : '+ Log'}
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

  const { state, dispatch } = useContext(AppContext);
  const { currentDate, goals, logs } = state;
  const meals = logs[currentDate] || [];

  const consumed = useMemo(() => ({
    calories: meals.reduce((s, m) => s + m.totalCalories, 0),
    protein: meals.reduce((s, m) => s + m.totalProtein, 0),
  }), [meals]);

  const suggestions = useMemo(() => getSuggestions(consumed, goals), [consumed, goals]);

  const isToday = currentDate === getToday();

  const changeDate = delta => {
    const d = new Date(currentDate + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    const newDate = d.toISOString().split('T')[0];
    if (newDate <= getToday()) dispatch({ type: 'SET_DATE', payload: newDate });
  };

  const handleDelete = mealId => dispatch({ type: 'DELETE_MEAL', payload: { date: currentDate, mealId } });

  const handleRepeat = meal => {
    const today = getToday();
    dispatch({
      type: 'ADD_MEAL',
      payload: {
        date: today,
        meal: {
          ...meal,
          id: genId(),
          time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
        },
      },
    });
    if (currentDate !== today) dispatch({ type: 'SET_DATE', payload: today });

  const calRemaining = Math.max(0, goals.calories - consumed.calories);

  return (
    <div className="p-4 pb-36">
      {/* Date navigation */}
      <div className="flex items-center justify-between mb-5">
        <button onClick={() => changeDate(-1)} className="w-10 h-10 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xl flex items-center justify-center transition-colors">‹</button>

      </div>

        {/* Rings */}
        <div className="flex justify-around mb-5 pb-4 border-b border-gray-700/50">

          <div className="w-px bg-gray-700/50 self-stretch" />

function History() {
  const { state, dispatch } = useContext(AppContext);
  const { logs, goals, currentDate } = state;

  const todayObj = new Date();
  const [calYear, setCalYear] = useState(todayObj.getFullYear());
  const [calMonth, setCalMonth] = useState(todayObj.getMonth());
  const [selectedDay, setSelectedDay] = useState(currentDate);

  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstDayOfWeek = new Date(calYear, calMonth, 1).getDay();

  const dayStr = d => `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

  const getDayStatus = d => {
    const str = dayStr(d);
    const dayMeals = logs[str] || [];
    if (dayMeals.length === 0) return 'empty';
    const cal = dayMeals.reduce((s, m) => s + m.totalCalories, 0);
    const pct = cal / goals.calories;
    if (pct >= 0.85 && pct <= 1.15) return 'goal';
    if (pct >= 0.55) return 'partial';
    return 'low';
  };

  const changeMonth = delta => {
    let m = calMonth + delta, y = calYear;
    if (m > 11) { m = 0; y++; }
    if (m < 0) { m = 11; y--; }
    setCalMonth(m); setCalYear(y);
  };

  const selectDay = d => {
    const str = dayStr(d);
    setSelectedDay(str);
    dispatch({ type: 'SET_DATE', payload: str });
  };

  const viewMeals = logs[selectedDay] || [];
  const viewConsumed = {
    calories: viewMeals.reduce((s, m) => s + m.totalCalories, 0),
    protein: viewMeals.reduce((s, m) => s + m.totalProtein, 0),
  };

  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = getToday();

  const statusStyle = {
    empty: 'text-gray-500 hover:bg-gray-700',
    goal: 'bg-green-500/20 text-green-300 hover:bg-green-500/30',
    partial: 'bg-yellow-500/20 text-yellow-300 hover:bg-yellow-500/30',
    low: 'bg-red-500/20 text-red-300 hover:bg-red-500/30',
  };

  return (
    <div className="p-4 pb-36">
      <h2 className="text-2xl font-bold text-white mb-1">Food History</h2>
      <p className="text-gray-400 text-sm mb-5">Browse your past nutrition</p>

      {/* Calendar */}
      <div className="bg-gray-800/60 border border-gray-700/40 rounded-3xl p-4 mb-4">
        {/* Month nav */}
        <div className="flex items-center justify-between mb-4">
          <button onClick={() => changeMonth(-1)} className="w-9 h-9 rounded-xl bg-gray-700 hover:bg-gray-600 text-gray-300 flex items-center justify-center text-lg transition-colors">‹</button>
          <span className="text-white font-bold">{monthNames[calMonth]} {calYear}</span>
          <button onClick={() => changeMonth(1)} className="w-9 h-9 rounded-xl bg-gray-700 hover:bg-gray-600 text-gray-300 flex items-center justify-center text-lg transition-colors">›</button>
        </div>

        {/* Day headers */}
        <div className="grid grid-cols-7 gap-1 mb-2">
          {['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(d => (
            <div key={d} className="text-center text-xs text-gray-500 font-semibold py-1">{d}</div>
          ))}
        </div>

        {/* Days grid */}
        <div className="grid grid-cols-7 gap-1">
          {Array.from({ length: firstDayOfWeek }).map((_, i) => <div key={`pad-${i}`} />)}
          {Array.from({ length: daysInMonth }).map((_, i) => {
            const d = i + 1;
            const str = dayStr(d);
            const isSelected = str === selectedDay;
            const isToday = str === today;
            const isFuture = str > today;
            const status = isFuture ? 'future' : getDayStatus(d);

            return (
              <button
                key={d}
                disabled={isFuture}
                onClick={() => selectDay(d)}
                className={`
                  aspect-square rounded-xl flex items-center justify-center text-xs font-semibold transition-all
                  ${isSelected ? 'bg-green-600 text-white ring-2 ring-green-400 ring-offset-1 ring-offset-gray-800 scale-110' : ''}
                  ${!isSelected && isToday ? 'ring-1 ring-green-500 text-green-400' : ''}
                  ${!isSelected && !isToday && !isFuture ? statusStyle[status] : ''}
                  ${isFuture ? 'text-gray-700 cursor-not-allowed' : ''}
                `}
              >
                {d}
              </button>
            );
          })}
        </div>

        {/* Legend */}
        <div className="flex gap-4 mt-4 justify-center flex-wrap">
          {[['bg-green-500/30 text-green-400', 'Goal met'], ['bg-yellow-500/30 text-yellow-400', 'Partial'], ['bg-red-500/30 text-red-400', 'Low']].map(([cls, label]) => (
            <span key={label} className="flex items-center gap-1.5 text-xs text-gray-400">
              <span className={`w-3.5 h-3.5 rounded-sm ${cls}`} />
              {label}
            </span>
          ))}
        </div>
      </div>

      {/* Selected day detail */}
      <div className="bg-gray-800/60 border border-gray-700/40 rounded-3xl p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-white font-bold">{selectedDay === today ? '✨ Today' : formatDateShort(selectedDay)}</h3>
          {viewMeals.length > 0 && (
            <div className="flex gap-3">
              <span className="text-xs text-green-400 font-semibold">{viewConsumed.calories} kcal</span>
              <span className="text-xs text-blue-400 font-semibold">{viewConsumed.protein}g protein</span>
            </div>
          )}
        </div>

        {viewMeals.length === 0 ? (
          <div className="text-center py-6">
            <div className="text-4xl mb-2">📋</div>
            <p className="text-gray-400 text-sm">No meals logged on this day</p>
          </div>
        ) : (
          <>
            <div className="mb-3">
              <ProgressBar
                value={viewConsumed.calories} max={goals.calories}
                colorClass="bg-green-500" label="Calories"
                current={viewConsumed.calories} goal={goals.calories} unit=" kcal"
              />
              <ProgressBar
                value={viewConsumed.protein} max={goals.protein}
                colorClass="bg-blue-500" label="Protein"
                current={viewConsumed.protein} goal={goals.protein} unit="g"
              />
            </div>
            {viewMeals.map(meal => (
              <div key={meal.id} className="flex justify-between items-center py-2.5 border-b border-gray-700/50 last:border-0">
                <div>
                  <p className="text-sm text-white font-medium">{meal.name}</p>
                  <p className="text-xs text-gray-500 mt-0.5">{meal.time} · {meal.items.length} item{meal.items.length !== 1 ? 's' : ''}</p>
                </div>
                <div className="text-right">
                  <p className="text-sm font-semibold text-green-400">{meal.totalCalories} kcal</p>
                  <p className="text-xs text-blue-400">{meal.totalProtein}g</p>
                </div>
              </div>
            ))}
          </>
        )}
      </div>
    </div>
  );
}

// WEEKLY SUMMARY PAGE
// ============================================================
function LineChart({ data, color, goalColor, label, unit, goal }) {
  const W = 300, H = 110, PAD = { t: 20, b: 22, l: 8, r: 8 };
  const innerW = W - PAD.l - PAD.r;
  const innerH = H - PAD.t - PAD.b;

  const allValues = data.map(d => d.value).concat(goal ? [goal] : []);
  const maxVal = Math.max(...allValues, 1) * 1.15;

  const toX = i => PAD.l + (i / Math.max(data.length - 1, 1)) * innerW;
  const toY = v => PAD.t + innerH - (v / maxVal) * innerH;

  const pts = data.map((d, i) => `${toX(i)},${toY(d.value)}`).join(' ');
  const goalY = goal ? toY(goal) : null;

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <span className="text-xs font-bold text-gray-400 uppercase tracking-widest">{label}</span>
        {goal && <span className="text-xs text-gray-500">Goal: {goal}{unit}</span>}
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} className="overflow-visible">
        <defs>
          <linearGradient id={`g-${label}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.25" />
            <stop offset="100%" stopColor={color} stopOpacity="0.02" />
          </linearGradient>
        </defs>

        {/* Goal dashed line */}
        {goalY && (
          <line x1={PAD.l} y1={goalY} x2={W - PAD.r} y2={goalY}
            stroke={goalColor || '#4b5563'} strokeDasharray="5 3" strokeWidth="1.5" opacity="0.7" />
        )}

        {/* Area fill */}
        {data.some(d => d.value > 0) && (
          <polygon
            points={`${PAD.l},${PAD.t + innerH} ${pts} ${W - PAD.r},${PAD.t + innerH}`}
            fill={`url(#g-${label})`}
          />
        )}

        {/* Line */}
        {data.some(d => d.value > 0) && (
          <polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        )}

        {/* Data points */}
        {data.map((d, i) => (
          <g key={i}>
            {d.value > 0 && (
              <>
                <circle cx={toX(i)} cy={toY(d.value)} r="4.5" fill={color} opacity="0.9" />
                <circle cx={toX(i)} cy={toY(d.value)} r="2" fill="white" opacity="0.8" />
                <text x={toX(i)} y={toY(d.value) - 10} textAnchor="middle" fill={color} fontSize="9" fontWeight="600">
                  {d.value > 0 ? d.value : ''}
                </text>
              </>
            )}
            <text x={toX(i)} y={H - 2} textAnchor="middle" fill="#6b7280" fontSize="9">
              {d.label}
            </text>
          </g>
        ))}
      </svg>
    </div>
  );
}

function Weekly() {
  const { state } = useContext(AppContext);
  const { logs, goals } = state;
  const days = getLast7Days();

  const chartData = days.map(d => {
    const dayMeals = logs[d] || [];
    const date = new Date(d + 'T00:00:00');
    return {
      date: d,
      label: date.toLocaleDateString('en-US', { weekday: 'short' }).substring(0, 2),
      calories: dayMeals.reduce((s, m) => s + m.totalCalories, 0),
      protein: dayMeals.reduce((s, m) => s + m.totalProtein, 0),
      meals: dayMeals.length,
    };
  });

  const logged = chartData.filter(d => d.calories > 0);
  const avgCal = logged.length ? Math.round(logged.reduce((s, d) => s + d.calories, 0) / logged.length) : 0;
  const avgPro = logged.length ? Math.round(logged.reduce((s, d) => s + d.protein, 0) / logged.length * 10) / 10 : 0;
  const adherence = Math.round(logged.filter(d => d.calories >= goals.calories * 0.85 && d.calories <= goals.calories * 1.15).length / 7 * 100);
  const totalMeals = chartData.reduce((s, d) => s + d.meals, 0);

  return (
    <div className="p-4 pb-36">
      <h2 className="text-2xl font-bold text-white mb-1">Weekly Summary</h2>
      <p className="text-gray-400 text-sm mb-5">Last 7 days at a glance</p>

      {/* Stats grid */}
      <div className="grid grid-cols-2 gap-3 mb-4">
        {[
          { label: 'Avg Calories', value: avgCal, unit: 'kcal/day', color: 'text-green-400', emoji: '🔥' },
          { label: 'Avg Protein', value: `${avgPro}g`, unit: 'per day', color: 'text-blue-400', emoji: '💪' },
          { label: 'Goal Adherence', value: `${adherence}%`, unit: 'days on target', color: 'text-purple-400', emoji: '🎯' },
          { label: 'Total Meals', value: totalMeals, unit: `${logged.length} days logged`, color: 'text-orange-400', emoji: '🍽️' },
        ].map(stat => (
          <div key={stat.label} className="bg-gray-800/60 border border-gray-700/40 rounded-2xl p-4">
            <div className="flex items-start justify-between">
              <div>
                <p className={`text-2xl font-bold ${stat.color}`}>{stat.value}</p>
                <p className="text-xs text-gray-400 mt-0.5">{stat.unit}</p>
              </div>
              <span className="text-2xl">{stat.emoji}</span>
            </div>
            <p className="text-xs text-gray-500 mt-2">{stat.label}</p>
          </div>
        ))}
      </div>

      {/* Calorie chart */}
      <div className="bg-gray-800/60 border border-gray-700/40 rounded-3xl p-5 mb-4">
        <LineChart
          data={chartData.map(d => ({ label: d.label, value: d.calories }))}
          color="#22c55e" goalColor="#166534" label="Calorie Trend" unit=" kcal" goal={goals.calories}
        />
      </div>

      {/* Protein chart */}
      <div className="bg-gray-800/60 border border-gray-700/40 rounded-3xl p-5 mb-4">
        <LineChart
          data={chartData.map(d => ({ label: d.label, value: d.protein }))}
          color="#3b82f6" goalColor="#1e3a5f" label="Protein Trend" unit="g" goal={goals.protein}
        />
      </div>

      {/* Day-by-day breakdown */}
      <div className="bg-gray-800/60 border border-gray-700/40 rounded-3xl p-4">
        <h3 className="text-sm font-bold text-gray-300 mb-4">Daily Breakdown</h3>
        {chartData.map(d => {
          const calPct = goals.calories ? Math.min((d.calories / goals.calories) * 100, 100) : 0;
          const isOnTarget = d.calories >= goals.calories * 0.85 && d.calories <= goals.calories * 1.15;
          const fullDate = new Date(d.date + 'T00:00:00');
          return (
            <div key={d.date} className="mb-3.5 last:mb-0">
              <div className="flex items-center justify-between mb-1">
                <div className="flex items-center gap-2">
                  <span className="text-xs text-gray-400 w-7 font-medium">{d.label}</span>
                  {isOnTarget && d.calories > 0 && <span className="text-xs text-green-500">✓</span>}
                </div>
                <span className="text-xs text-gray-400">
                  {d.calories > 0 ? `${d.calories} kcal · ${d.protein}g protein` : 'Not logged'}
                </span>
              </div>
              <div className="flex-1 h-2 bg-gray-700/60 rounded-full overflow-hidden">
                <div
                  className={`h-2 rounded-full transition-all ${isOnTarget ? 'bg-green-500' : d.calories > goals.calories * 1.15 ? 'bg-red-500' : 'bg-yellow-500'}`}
                  style={{ width: `${calPct}%` }}
                />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BottomNav({ page, setPage }) {
  const { state } = useContext(AppContext);
  const meals = state.logs[state.currentDate] || [];
  const consumed = meals.reduce((s, m) => s + m.totalCalories, 0);
  const pct = Math.min(Math.round((consumed / (state.goals.calories || 1)) * 100), 100);

  const tabs = [
    { id: 'dashboard', icon: 'fa-solid fa-house',       label: 'Home'    },
    { id: 'history',   icon: 'fa-solid fa-calendar-days', label: 'History' },
    { id: 'weekly',    icon: 'fa-solid fa-chart-line',   label: 'Weekly'  },
    { id: 'goals',     icon: 'fa-solid fa-bullseye',     label: 'Goals'   },
  ];

  return (
    <nav className="fixed bottom-0 left-0 right-0 z-40 bg-gray-900/95 backdrop-blur-xl border-t border-gray-800">
      <div className="max-w-lg mx-auto px-2 pt-2 nav-safe-bottom">
        <div className="flex justify-around items-center">
          {tabs.map(tab => (
            <button
              key={tab.id}
              onClick={() => setPage(tab.id)}
              className={`flex flex-col items-center gap-1 px-5 py-1.5 rounded-2xl transition-all ${
                page === tab.id
                  ? 'text-green-400 bg-green-500/10'
                  : 'text-gray-500 hover:text-gray-300'
              }`}
            >
              <i className={`${tab.icon} text-xl`} />
              <span className="text-xs font-medium">{tab.label}</span>
            </button>
          ))}
        </div>
      </div>
    </nav>
  );
}

// HEADER
// ============================================================
function Header({ page }) {
  const { state } = useContext(AppContext);
  const meals = state.logs[state.currentDate] || [];
  const consumed = {
    calories: meals.reduce((s, m) => s + m.totalCalories, 0),
    protein: meals.reduce((s, m) => s + m.totalProtein, 0),
  };
  const calPct = Math.min(Math.round((consumed.calories / (state.goals.calories || 1)) * 100), 100);

  return (
    <header className="sticky top-0 z-30 bg-gray-950/95 backdrop-blur-xl border-b border-gray-800/80">
      <div className="max-w-lg mx-auto px-4 py-3">
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-lg font-bold text-white">
              NutriTrack <span className="text-green-400">AI</span>
            </h1>
            <p className="text-xs text-gray-500">{formatDateShort(state.currentDate)}</p>
          </div>
          <div className="flex items-center gap-2 bg-gray-800 rounded-2xl px-3 py-2 border border-gray-700/50">
            <div className="w-6 h-6 relative">
              <svg width="24" height="24" viewBox="0 0 24 24" style={{ transform: 'rotate(-90deg)' }}>
                <circle cx="12" cy="12" r="8" fill="none" stroke="#1f2937" strokeWidth="3.5" />
                <circle
                  cx="12" cy="12" r="8" fill="none"
                  stroke="#22c55e" strokeWidth="3.5"
                  strokeDasharray={`${calPct * 0.503} ${50.3}`}
                  strokeLinecap="round"
                />
              </svg>
            </div>
            <div>
              <span className="text-green-400 text-sm font-bold">{consumed.calories}</span>
              <span className="text-gray-500 text-xs"> / {state.goals.calories} kcal</span>
            </div>
          </div>
        </div>
      </div>
    </header>
  );
}

// ============================================================
// ROOT APP
// ============================================================
function App() {
  const [state, dispatch] = useReducer(reducer, null, getInitialState);
  const [page, setPage] = useState('dashboard');
  const [showLog, setShowLog] = useState(false);

  const handleSaveMeal = meal => {
    dispatch({ type: 'ADD_MEAL', payload: { date: state.currentDate, meal } });
  };

  return (
    <AppContext.Provider value={{ state, dispatch }}>
      <div className="min-h-screen bg-gray-950 text-white">
        <div className="max-w-lg mx-auto relative min-h-screen">
          <Header page={page} />
          <main>
            {page === 'dashboard' && <Dashboard onLogMeal={() => setShowLog(true)} />}
            {page === 'goals' && <Goals />}
            {page === 'history' && <History />}
            {page === 'weekly' && <Weekly />}
          </main>
          <BottomNav page={page} setPage={setPage} />
          {showLog && (
            <LogMealModal
              onClose={() => setShowLog(false)}
              onSave={meal => { handleSaveMeal(meal); setShowLog(false); }}
            />
          )}
        </div>
      </div>
    </AppContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
